<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Full-bleed gold background (maskable-safe) -->
  <rect width="512" height="512" fill="#ffc800"/>
  <!-- Blue speech-bubble seal saying 文, with a tactile bottom edge -->
  <g transform="translate(250 246) rotate(-3.4)">
    <g fill="#117cad" transform="translate(0 24)">
      <rect x="-148" y="-136" width="296" height="264" rx="64"/>
      <path d="M-88 120 L-114 196 L-8 120 Z"/>
    </g>
    <g fill="#1cb0f6">
      <rect x="-148" y="-136" width="296" height="264" rx="64"/>
      <path d="M-88 120 L-114 196 L-8 120 Z"/>
    </g>
    <text x="0" y="-2" dominant-baseline="middle" font-family="LXGW WenKai TC, Kaiti TC, Kaiti SC, STKaiti, BiauKai, DFKai-SB, KaiTi, serif" font-size="186" font-weight="700" fill="#fff6dc" text-anchor="middle">文</text>
  </g>
  <!-- Orange rising tone mark (wén, 2nd tone) -->
  <g transform="translate(352 120) rotate(-43)">
    <rect x="-46" y="-6" width="92" height="30" rx="15" fill="#e58700"/>
    <rect x="-46" y="-15" width="92" height="30" rx="15" fill="#ff9600"/>
  </g>
</svg>
