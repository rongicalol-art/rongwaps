<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Full-bleed gold background (maskable-safe) -->
  <rect width="512" height="512" fill="#ffc800"/>
  <!-- Blue 文 seal, slightly tilted, with a tactile bottom edge -->
  <g transform="translate(256 246) rotate(-4)">
    <rect x="-140" y="-116" width="280" height="280" rx="40" fill="#117cad"/>
    <rect x="-140" y="-140" width="280" height="280" rx="40" fill="#1cb0f6"/>
    <rect x="-114" y="-114" width="228" height="228" rx="22" fill="none" stroke="#fff6dc" stroke-width="10"/>
    <text x="0" y="6" dominant-baseline="middle" font-family="LXGW WenKai TC, Kaiti TC, Kaiti SC, STKaiti, BiauKai, DFKai-SB, KaiTi, serif" font-size="170" font-weight="700" fill="#fff6dc" text-anchor="middle">文</text>
  </g>
</svg>
