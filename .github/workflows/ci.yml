name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run games:check
      - run: npx --no-install wrangler deploy --dry-run --config games/wrangler.staging.jsonc
      - run: npm run games:test
      - run: npm test
      - run: npm run jev:lint
      - run: npm run build
        env:
          # Placeholders so the client bundle builds; never real keys.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
