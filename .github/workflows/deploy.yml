name: Deploy

# Runs after CI passes on a push:
#   main       → staging (staging migrations applied first, then checked)
#   production → live site (only if its migrations are already applied;
#                checked after deploy, rolled back automatically on failure)
# Each job builds the site and uploads it to Cloudflare Workers
# (scripts/release/cloudflare.ts); this workflow is the only deployer.
# See docs/RELEASING.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, production]

permissions:
  contents: write # release tags and notes
  issues: write # rollback notices
  statuses: write # the "Staging" check on the commit a Release PR would ship

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  SHA: ${{ github.event.workflow_run.head_sha }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
  # Public values every build of the app uses.
  VITE_AUDIO_BASE_URL: https://audio.ronsmandarin.com
  PRODUCTION_REF: ylpzxpqyfaayavkvhikw
  STAGING_REF: zpljyjcbqkrelpdzvmqz

jobs:
  staging:
    env:
      GH_TOKEN: ${{ github.token }}
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # A docs- or test-only change keeps the running staging build (the app it serves is the same),
      # which saves GitHub Actions minutes.
      - name: Does staging need a new build?
        id: changed
        run: |
          live=$(curl -fsS -m 90 "${{ vars.STAGING_URL }}/healthz" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).commit||"")}catch{console.log("")}})' || true)
          if [ -z "$live" ] || ! git cat-file -e "$live^{commit}" 2>/dev/null; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          app=$(git diff --name-only "$live" "$SHA" | grep -Ev '^(docs/|\.claude/|\.agents/|\.github/|tests/|supabase/tests/|scripts/(release|jev|dev|load)/|[^/]+\.md$)' || true)
          if [ -n "$app" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; else echo "build=false" >> "$GITHUB_OUTPUT"; echo "Staging already runs the same app ($live); no new build."; fi
      - uses: supabase/setup-cli@v3
        with:
          version: 2.106.0
      - name: Apply new migrations to staging (synthetic data only)
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -z "$STAGING_DATABASE_URL" ]; then echo "::warning::STAGING_DATABASE_URL not set; staging migrations skipped"; exit 0; fi
          case "$STAGING_DATABASE_URL" in *"$PRODUCTION_REF"*) echo "::error::STAGING_DATABASE_URL points at production"; exit 1;; esac
          supabase db push --db-url "$STAGING_DATABASE_URL" --yes
      - name: Deploy the staging Study together server
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN is not set"; exit 1; fi
          npm ci --ignore-scripts
          npx --no-install wrangler deploy --config games/wrangler.staging.jsonc --message "staging ${SHA:0:8}"
      - name: Build and deploy staging
        if: steps.changed.outputs.build == 'true'
        env:
          APP_ENV: staging
          APP_COMMIT: ${{ env.SHA }}
          VITE_SUPABASE_URL: https://${{ env.STAGING_REF }}.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY }}
          CARRY_OVER_FROM: ${{ vars.STAGING_URL }}
        run: |
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then echo "::error::Repository variable STAGING_SUPABASE_ANON_KEY is not set (docs/RELEASING.md → Remaining one-time setup)"; exit 1; fi
          npm run build
          SUPABASE_ANON_KEY="$VITE_SUPABASE_ANON_KEY" node scripts/release/cloudflare.ts deploy server/wrangler.staging.jsonc "$SHA"
      - name: Check staging
        if: steps.changed.outputs.build == 'true'
        run: node scripts/release/smoke.ts "${{ vars.STAGING_URL }}" --env staging --commit "$SHA" --supabase-ref "$STAGING_REF" --forbid-ref "$PRODUCTION_REF"
      # The Release PR shows this check: green only once staging has run (or already ran) this exact app.
      - name: Mark the commit as checked on staging
        run: |
          for attempt in 1 2 3; do
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=success -f context=Staging \
              -f description="Staging ran this commit" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null && exit 0
            sleep $((attempt * 5))
          done
          exit 1

  production:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SITE: https://ronsmandarin.com
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Every migration in this release is already applied
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          applied=$(psql "$DATABASE_URL" --no-psqlrc -At -c 'select version from supabase_migrations.schema_migrations')
          missing=""
          for file in supabase/migrations/*.sql; do
            version=$(basename "$file" | cut -d_ -f1)
            grep -qx "$version" <<< "$applied" || missing="$missing $(basename "$file")"
          done
          if [ -n "$missing" ]; then
            echo "::error::Run the Migrate workflow (production) before releasing. Not applied:$missing"
            exit 1
          fi

      # The Study together server ships with the app it serves (it was once left
      # 10 changes behind). It goes first: the new app expects it; it keeps
      # serving the previous app version too.
      - name: Deploy the Study together server
        id: worker
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN is not set"; exit 1; fi
          npm ci --ignore-scripts
          npx --no-install wrangler deploy --config games/wrangler.jsonc --message "release ${SHA:0:8}"

      # The live build. A failed build or upload never replaces the live release.
      - name: Build and deploy
        id: deploy
        env:
          APP_ENV: production
          APP_COMMIT: ${{ env.SHA }}
          VITE_SUPABASE_URL: https://${{ env.PRODUCTION_REF }}.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ vars.PRODUCTION_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          CARRY_OVER_FROM: ${{ env.SITE }}
        run: |
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then echo "::error::Repository variable PRODUCTION_SUPABASE_ANON_KEY is not set (docs/RELEASING.md → Remaining one-time setup)"; exit 1; fi
          npm run build
          SUPABASE_ANON_KEY="$VITE_SUPABASE_ANON_KEY" node scripts/release/cloudflare.ts deploy server/wrangler.jsonc "$SHA"

      - name: Check the live site
        id: smoke
        run: node scripts/release/smoke.ts "$SITE" --env production --commit "$SHA" --supabase-ref "$PRODUCTION_REF" --forbid-ref "$STAGING_REF"

      - name: Roll back to the previous release
        # Only a failed check of a new live release needs undoing.
        if: failure() && steps.smoke.outcome == 'failure' && steps.deploy.outputs.previous_version != '' && steps.deploy.outputs.previous_version != steps.deploy.outputs.version
        run: |
          node scripts/release/cloudflare.ts rollback server/wrangler.jsonc "${{ steps.deploy.outputs.previous_version }}"
          node scripts/release/smoke.ts "$SITE" --env production --supabase-ref "$PRODUCTION_REF" --forbid-ref "$STAGING_REF"
          gh issue create --title "Release ${SHA:0:8} was rolled back" --body "The live-site check failed after deploying \`$SHA\`, so the previous release (version \`${{ steps.deploy.outputs.previous_version }}\`) was restored automatically.

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Next: fix on a branch, PR into main, check staging, then release again. See docs/RELEASING.md → Undo a release."

      - name: Tag the release
        if: success()
        run: |
          tag="release-$(date -u +%Y.%m.%d-%H%M)"
          previous=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')
          gh release create "$tag" --target "$SHA" --title "$tag" --generate-notes ${previous:+--notes-start-tag "$previous"}
          echo "### Released \`$tag\` (${SHA:0:8}) to $SITE" >> "$GITHUB_STEP_SUMMARY"
