name: Release PR

# Keeps one "Release" PR from main (staging) into production (live site) up to
# date, listing what learners will get and any migrations to run first.
# Merging it is the release. A fix merged straight into production gets a
# back-merge PR into main so the two never drift.
on:
  push:
    branches: [main, production]

permissions:
  contents: write # the back-merge pushes a throwaway copy of production
  pull-requests: write
  statuses: write # "Staging" stays pending until Deploy has checked this commit on staging

# One run per branch: a production push never cancels the main run that writes the Release PR description.
concurrency:
  group: release-pr-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Open or update the release PR
        if: github.ref_name == 'main'
        run: |
          set -euo pipefail
          # GitHub's API fails now and then; retry instead of leaving a stale description.
          gh() { for attempt in 1 2 3; do command gh "$@" && return 0; sleep $((attempt * 5)); done; return 1; }
          head=$(git rev-parse origin/main)
          state=$(command gh api "repos/$GITHUB_REPOSITORY/commits/$head/status" --jq '[.statuses[] | select(.context == "Staging")][0].state // ""' || true)
          if [ "$state" != success ]; then
            gh api "repos/$GITHUB_REPOSITORY/statuses/$head" -f state=pending -f context=Staging -f description="Waiting for staging to run this commit" > /dev/null
          fi
          git fetch --no-tags origin production
          if [ "$(git rev-list --count origin/production..origin/main)" = 0 ]; then echo "Nothing to release."; exit 0; fi
          prs=$(git log --first-parent --format='%s' origin/production..origin/main | sed -nE 's/^Merge pull request #([0-9]+).*/#\1/p; s/.*\(#([0-9]+)\)$/#\1/p' | sort -u -t'#' -k2 -n)
          migrations=$(git diff --name-only --diff-filter=A origin/production origin/main -- supabase/migrations | sed 's/^/- `/; s/$/`/')
          {
            echo "Merging this releases **staging** ($(git rev-parse --short origin/main)) to **ronsmandarin.com**."
            echo
            echo "**Before merging:** the **Staging** check below must be green (staging ran this exact commit), then try it on staging."
            if [ -n "$migrations" ]; then
              echo
              echo "**Database changes — run first:** Actions → *Migrate production* (ref \`main\`, type \`production\`). The release refuses to deploy until they are applied."
              echo "$migrations"
            fi
            echo
            echo "**Included:**"
            for pr in $prs; do
              echo "- $(gh pr view "${pr#\#}" --json title,number --jq '"#\(.number) \(.title)"' 2>/dev/null || echo "$pr")"
            done
            echo
            echo "After merge, Deploy checks the live site and rolls back automatically if a check fails. Undo later: Actions → *Roll back*."
          } > "$RUNNER_TEMP/body.md"
          title="Release: $(git rev-list --count --first-parent origin/production..origin/main) change(s) to ronsmandarin.com"
          existing=$(gh pr list --base production --head main --state open --json number --jq '.[0].number // ""')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base production --head main --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi

      # From a throwaway copy of production, never production itself: with "Automatically delete head
      # branches" on, merging a PR whose head is production deletes the live branch (PR #74, 2026-11-04).
      - name: Back-merge a production hotfix into main
        if: github.ref_name == 'production'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [ "$(git rev-list --count --no-merges origin/main..origin/production)" = 0 ]; then exit 0; fi
          existing=$(gh pr list --base main --state open --json number,headRefName --jq '[.[] | select(.headRefName | startswith("back-merge/"))][0].headRefName // ""')
          branch="${existing:-back-merge/production-$(git rev-parse --short origin/production)}"
          # Production only moves forward, so this is a plain fast-forward of the copy.
          git push origin "origin/production:refs/heads/$branch"
          [ -n "$existing" ] || gh pr create --base main --head "$branch" --title "Back-merge production fixes into main" \
            --body "Production has commits main lacks (a hotfix). Merge this so the next release keeps them. It comes from \`$branch\`, a copy of production, so merging it never deletes production."
