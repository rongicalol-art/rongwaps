name: Health

# Every morning, a read-only look at production: database size against the free
# 500 MB, public sign-ups against the cap, and new reports. When something needs
# the owner, it opens one "Health check" issue (or comments on the open one), so
# the GitHub app on the phone notifies. Quiet days do nothing.

on:
  schedule:
    - cron: '30 1 * * *' # 09:30 Taiwan
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read production numbers (read-only)
        id: read
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          # Each query runs in a read-only transaction (as the backup does), so this job can never write.
          q() { psql "$DATABASE_URL" --no-psqlrc -q -v ON_ERROR_STOP=1 -At -c 'begin transaction read only' -c "$1" -c 'commit'; }
          size_mb=$(q "select pg_database_size(current_database()) / 1048576")
          signups=$(q "select count(*) from auth.users where created_at > now() - interval '1 day'")
          open=false; cap=0; public=0; reports=0
          # Before the public-accounts migrations reach production these tables don't exist yet.
          if [ "$(q "select to_regclass('private.signup_settings') is not null")" = "t" ]; then
            open=$(q "select public_open from private.signup_settings")
            [ "$open" = "t" ] && open=true || open=false
            cap=$(q "select public_cap from private.signup_settings")
            public=$(q "select private.public_account_count()")
          fi
          if [ "$(q "select to_regclass('private.user_reports') is not null")" = "t" ]; then
            reports=$(q "select count(*) from private.user_reports where created_at > now() - interval '1 day'")
          fi
          {
            echo "size_mb=$size_mb"; echo "signups=$signups"; echo "open=$open"
            echo "cap=$cap"; echo "public=$public"; echo "reports=$reports"
          } >> "$GITHUB_OUTPUT"
          echo "Database ${size_mb} MB · sign-ups today ${signups} · public ${public}/${cap} (open: ${open}) · reports today ${reports}"

      - name: Tell the owner when something needs them
        env:
          GH_TOKEN: ${{ github.token }}
          SIZE_MB: ${{ steps.read.outputs.size_mb }}
          SIGNUPS: ${{ steps.read.outputs.signups }}
          OPEN: ${{ steps.read.outputs.open }}
          CAP: ${{ steps.read.outputs.cap }}
          PUBLIC: ${{ steps.read.outputs.public }}
          REPORTS: ${{ steps.read.outputs.reports }}
        run: |
          notes=""
          if [ "$SIZE_MB" -ge 400 ]; then
            notes="$notes
          - **Database is ${SIZE_MB} MB** of the free 500 MB. Past 500 MB saving progress stops. Options: Supabase Pro, or ask Claude to trim review history."
          fi
          if [ "$OPEN" = "true" ] && [ "$CAP" -gt 0 ] && [ $((PUBLIC * 10)) -ge $((CAP * 9)) ]; then
            notes="$notes
          - **Sign-ups are at ${PUBLIC} of ${CAP}.** New people will see \"full for now\". To raise it: \`update private.signup_settings set public_cap = $((CAP + 200)), updated_at = now();\`"
          fi
          if [ "$REPORTS" -gt 0 ]; then
            notes="$notes
          - **${REPORTS} new report(s)** in the last day. Read them: \`select id, created_at, reason, place, message, reporter, target from private.user_reports order by id desc limit 50;\` (Supabase SQL editor). Ban or unban: docs/RELEASING.md → Public accounts."
          fi
          if [ -z "$notes" ]; then echo "Nothing needs the owner today."; exit 0; fi
          body="Health check, $(date -u +%F) (09:30 Taiwan). Sign-ups in the last day: ${SIGNUPS}.
          $notes

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body=$(printf '%s\n' "$body" | sed 's/^          //')
          existing=$(gh issue list --state open --search 'in:title "Health check"' --json number,title --jq '[.[] | select(.title == "Health check")][0].number // ""')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Health check" --body "$body"
          fi
