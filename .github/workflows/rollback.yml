name: Roll back

# Owner-run undo button (Actions → Roll back → Run workflow). Puts the
# previous Cloudflare version back within seconds; the database is untouched, so this
# is safe whenever the release's migrations were backward compatible (CI
# enforces that). Data recovery is a different procedure: docs/RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which site'
        type: choice
        options: [production, staging]
        default: production
      version:
        description: 'Cloudflare version id to restore, or "previous"'
        required: true
        default: previous

permissions:
  contents: read
  issues: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      CONFIG: ${{ inputs.target == 'production' && 'server/wrangler.jsonc' || 'server/wrangler.staging.jsonc' }}
      SITE: ${{ inputs.target == 'production' && 'https://ronsmandarin.com' || vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - name: Roll back
        id: rollback
        run: node scripts/release/cloudflare.ts rollback "$CONFIG" "${{ inputs.version }}"
      - name: Check the site
        run: |
          if [ "${{ inputs.target }}" = production ]; then
            node scripts/release/smoke.ts "$SITE" --env production --commit "${{ steps.rollback.outputs.commit }}" --supabase-ref ylpzxpqyfaayavkvhikw --forbid-ref zpljyjcbqkrelpdzvmqz
          else
            node scripts/release/smoke.ts "$SITE" --env staging --commit "${{ steps.rollback.outputs.commit }}" --supabase-ref zpljyjcbqkrelpdzvmqz --forbid-ref ylpzxpqyfaayavkvhikw
          fi
      - name: Record it
        if: inputs.target == 'production'
        run: |
          gh issue create --title "Production rolled back to ${{ steps.rollback.outputs.commit }}" --body "Manual rollback by @$GITHUB_ACTOR. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          The \`production\` branch still has the newer commits: fix forward with a PR, then release again."
