services:
  - type: web
    name: rongwaps
    env: node
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist-server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: ronmandarin-book
      - key: VITE_AUDIO_BASE_URL
        value: https://audio.ronsmandarin.com
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    healthCheckPath: /healthz
