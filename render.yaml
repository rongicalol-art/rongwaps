services:
  - type: web
    name: rongwaps
    env: node
    # The live site tracks the `production` branch. Render auto-deploy stays
    # off: .github/workflows/deploy.yml deploys each commit after its CI passes,
    # checks the site and rolls back on failure (docs/RELEASING.md).
    branch: production
    autoDeployTrigger: 'off'
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist-server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: ronmandarin-book
      - key: VITE_AUDIO_BASE_URL
        value: https://audio.ronsmandarin.com
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    healthCheckPath: /healthz
