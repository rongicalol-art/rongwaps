<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ron's Mandarin" />
    <meta name="theme-color" content="#f3f2f0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Dark appearance before first paint (useAppearance keeps rw-appearance in sync). -->
    <script>
      try {
        if (localStorage.getItem('rw-appearance') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#241e18');
        }
      } catch (e) {}
    </script>
    <!-- Prerendered public pages (scripts/build/prerender.ts) show #prerender to signed-out
         visitors until the app renders; signed-in visitors never see it. -->
    <style>#prerender{display:none}html.prerendered #prerender{display:block}html.prerendered #prerender~#root{display:none}</style>
    <script>
      try {
        if (!Object.keys(localStorage).some(function (k) { return /^sb-.+-auth-token$/.test(k); })) {
          document.documentElement.classList.add('prerendered');
        }
      } catch (e) {}
    </script>

    <!-- Primary Meta Tags -->
    <title>時代華語 Modern Chinese Study App · Ron's Mandarin</title>
    <meta name="title" content="時代華語 Modern Chinese Study App · Ron's Mandarin" />
    <meta
      name="description"
      content="Free companion for 時代華語 Modern Chinese: read-along lessons, grammar, book exercises, flashcards, memory hooks &amp; TOCFL mock tests."
    />
    <meta
      name="keywords"
      content="Modern Chinese, 時代華語, Modern Chinese study app, Modern Chinese grammar, Modern Chinese exercises, TOCFL mock test, Traditional Chinese, Taiwan Mandarin, Chinese flashcards"
    />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="google-site-verification" content="jOIXt1IoevtNritudkxEp_3pIlGXLIb71P94043-xbk" />
    <meta name="author" content="Ron's Mandarin" />

    <meta property="og:locale:alternate" content="zh_TW" />

    <script type="application/ld+json" id="page-jsonld">
      {

    <link rel="preconnect" href="https://audio.ronsmandarin.com" crossorigin />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preload" href="/fonts/nunito.woff2" as="font" type="font/woff2" crossorigin />

    <!--
      Nunito is self-hosted (see @font-face in src/index.css) for offline support.
      LXGW WenKai TC (a Chinese fallback behind the local TW-EduKai font) is the
      only remaining remote font; it is runtime-cached by the service worker.
      font-sans has no network dependency, so the UI shell always renders.
    -->
